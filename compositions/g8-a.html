    (function () {

      var root = document.querySelector('[data-composition-id="g8-a"]');
      var k = K.make(root, tl);

      var eU1 = SRC[6], eU2 = E.N("        u2 = User(username, mobile, password)");

      var D = k.layer({ x: 0, y: 56, w: 1920, h: 1080 });

      var box = CXA.img(k, D.el, "pf-box", { x: 1424, y: 318, h: 100 });

      // S79 two users with the same name
      BEAT.S79r1 = t; t = E.ins(eU1, [eU2], t, 0.4) + 0.2; t = E.typeAt(eU2, t, 0.05) + 0.9;

      t = CXA.pop(k, tl, unL, t) + 0.1;

      tl.fromTo(D.el, { y: 0 }, { y: 300, duration: 0.5, ease: "power2.inOut", immediateRender: false }, t);
      t = R.run([["Enter Username: pythonfan"], ["Enter Mobile: 9988556622"], ["Enter Password: #Tap123"], ["Username already exist"]], t + 0.3) + 0.3;
      // S80 57:47 highlight 'Username already exist'
      BEAT.S80r2 = t; ow.ring(ow.lines[ow.lines.length - 1], 0, 0, null, t); t += 1.6;

    })();
